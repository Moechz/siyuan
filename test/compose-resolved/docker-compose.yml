# ===========================================================================
# SiYuan for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : b3log/siyuan:v3.8.12 (Docker Hub, used unmodified)
#                  -> https://github.com/siyuan-note/siyuan
#
# Ports   : host 8166 -> container 6806. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/siyuandocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image runs as root and its entrypoint creates users;
#           the command below replaces it so the kernel runs as uid 1000 and
#           generates the access code on first start (never hard-coded, never
#           written to the log).
# Escaping: docker compose interpolates variables in compose files, so any
#           dollar sign meant for the shell is written twice.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  siyuandocker:
    image: b3log/siyuan:v3.8.12
    container_name: siyuandocker
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # ===========================================================================
        # SiYuan entrypoint for a non-root container (TOS 7 requirement).
        #
        # The upstream image's /opt/siyuan/entrypoint.sh creates a user and runs
        # `chown -R` over /opt/siyuan, /home/siyuan and the workspace, which needs
        # root. TOS runs the application as uid 1000, so this wrapper starts the
        # kernel directly and keeps the workspace on the mounted data folder.
        #
        # Access code (S6/F10): never hard-coded and never written to the log.
        #   1. ACCESS_AUTH_CODE in the container environment wins (user supplied).
        #   2. Otherwise a random code is generated once and kept in
        #      <workspace>/.access-code with mode 0600, so it survives restarts and
        #      upgrades without ever appearing in `docker logs` or `docker inspect`.
        # The code is handed to the kernel through SIYUAN_ACCESS_AUTH_CODE (the
        # kernel's own environment variable), not through argv.
        # ===========================================================================
        set -u
        set -e

        WORKSPACE=/data
        CODE_FILE="$${WORKSPACE}/.access-code"

        umask 077
        mkdir -p "$${WORKSPACE}"

        if ! ( : > "$${WORKSPACE}/.write-test" ) 2>/dev/null; then
            echo "siyuan: $${WORKSPACE} is not writable by uid $$(id -u)" >&2
            echo "siyuan: the application data folder must be owned by 1000:1000" >&2
            exit 1
        fi
        rm -f "$${WORKSPACE}/.write-test"

        if [ -n "$${ACCESS_AUTH_CODE:-}" ]; then
            CODE="$${ACCESS_AUTH_CODE}"
        elif [ -s "$${CODE_FILE}" ]; then
            CODE="$$(cat "$${CODE_FILE}")"
        else
            CODE="$$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-12)"
            printf '%s\n' "$${CODE}" > "$${CODE_FILE}"
            chmod 600 "$${CODE_FILE}" 2>/dev/null || true
        fi

        export SIYUAN_ACCESS_AUTH_CODE="$${CODE}"
        export HOME="$${WORKSPACE}"
        export TMPDIR=/tmp

        exec /opt/siyuan/kernel serve --workspace="$${WORKSPACE}"
    ports:
      - "8166:6806"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/siyuandocker/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:6806/check-auth"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8166
    protocol: http
